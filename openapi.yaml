openapi: "3.0.3"
info:
  title: 42_Matcha API
  version: "1.0"
servers:
  - url: https://api.server.test/v1

paths:
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: "user123"
              password: "password123"
      responses:
        "200":
          description: Login successful
        "400":
          description: Missing required fields
        "401":
          description: Incorrect email or password

  /auth/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            example:
              first_name: "test"
              last_name: "user"
              email: "user@email.com"
              username: "user123"
              password: "password123"
      responses:
        "200":
          description: Sign up successful
        "400":
          description: Invalid or missing required fields
          content:
            application/json:
              examples:
                missingFields:
                  value:
                    errorCode: 0
                    message: "Missing required fields"
                weakPassword:
                  value:
                    errorCode: 1
                    message: "Password is too weak"
        "409":
          description: User already exists

  /auth/forgot-password:
    post:
      description: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: "user@email.com"
      responses:
        "201":
          description: Accepted
        "400":
          description: Missing required fields
        "409":
          description: User does not exist

  /auth/reset-password:
    post:
      description: Change password after getting reset email
      parameters:
        - name: token
          in: query
          required: true
      requestBody:
        required: true
        content:
          application/json:
            example:
              newPassword: "oldpassword123"
              resetToken: ""
      responses:
        "200":
          description: Password changed
        "400":
          description: Invalid or missing required fields
          content:
            application/json:
              examples:
                missingFields:
                  value:
                    errorCode: 0
                    message: "Missing required fields"
                weakPassword:
                  value:
                    errorCode: 1
                    message: "Password is too weak"

  /auth/verify:
    get:
      description: Verify account after getting verification email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified

  /profile/me:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                profile:
                  firstname: "test_first"
                  lastname: "test_last"
                  username: "test_username"
                  picture: "http://localhost:5001/image/profile.jpg"
                isProfileCompleted: true
                notifications: []

  /profile/details:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                firstname: "firstname"
                lastname: "lastname"
                email: "user@email.com"
                date_of_birth: "01/01/2000"
                gender: "male"
                preference: "female"
                fame: 10
                biography: "this is my biography"
                interest:
                  - "one"
                  - "two"
                  - "three"
                  - "four"
                  - "five"
                pictures:
                  - "http://localhost:5001/image/profile.jpg"
                  - "http://localhost:5001/image/one.jpg"
                  - "http://localhost:5001/image/two.jpg"
                  - "http://localhost:5001/image/three.jpg"
                  - "http://localhost:5001/image/four.jpg"
                location:
                  latitude: 123
                  longitude: 456

    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gender:
                  type: string
                sexual_preference:
                  type: string
                biography:
                  type: string
                latitude:
                  type: number
                  format: float
                longitude:
                  type: number
                  format: float
                location_city:
                  type: string
            example:
              gender: "male"
              sexual_preference: "female"
              biography: "Hi, I am John"
              latitude: 1.3521
              longitude: 103.8198
              location_city: "Singapore"
      responses:
        "200":
          description: Profile updated

  /profile/profilepic:
    post:
      description: Upload or replace the single profile picture.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                picture:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile picture uploaded
        "400":
          description: Missing file, invalid file type, or invalid upload
        "401":
          description: Unauthorized
    get:
      description: Get the current profile picture.
      responses:
        "200":
          description: Profile picture returned
          content:
            application/json:
              example:
                picture:
                  image_url: "/uploads/profile.png"
        "401":
          description: Unauthorized
    delete:
      description: Delete the current profile picture.
      responses:
        "200":
          description: Profile picture deleted
        "401":
          description: Unauthorized

  /profile/pictures:
    post:
      description: Upload gallery pictures. Gallery pictures are separate from the single profile picture and are limited to 4.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                picture:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Gallery pictures uploaded
        "400":
          description: Missing file, invalid file type, or gallery picture limit reached
        "401":
          description: Unauthorized
    get:
      description: Get gallery pictures for the current user.
      responses:
        "200":
          description: Gallery pictures returned
          content:
            application/json:
              example:
                pictures:
                  - id: "67f41054-1337-4fd7-9ccf-dbd48f3c4ca8"
                    image_url: "/uploads/gallery-1.png"
                    is_profile_picture: false
        "401":
          description: Unauthorized

  /profile/pictures/{pictureId}:
    delete:
      description: Delete one gallery picture.
      parameters:
        - name: pictureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gallery picture deleted
        "401":
          description: Unauthorized
        "404":
          description: Picture not found
